server {
    listen 80;
    index index.php index.html;
    root /var/www/html/public;

    # Resolve the PHP-FPM service dynamically so an app container replacement
    # does not leave Nginx pointing at its previous Docker IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm_upstream laravel_app:9000;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_fpm_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
