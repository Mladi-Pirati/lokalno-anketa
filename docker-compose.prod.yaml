services:
  app:
    pull_policy: always
    image: ghcr.io/mladi-pirati/lokalno-anketa:main
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_SERVER: http
      APP_HTTP_PORT: "8080"
      PHP_CLI_SERVER_WORKERS: "4"
    expose:
      - "8080"
    volumes:
      - storage_data:/var/www/html/storage
      - public_build:/var/www/html/public
    env_file: .env
    depends_on:
      - db
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  db_data:
  storage_data:
  public_build:
